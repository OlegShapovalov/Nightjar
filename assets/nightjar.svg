<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="wingGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Скругленный фон приложения -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#27272a" stroke-width="2"/>

  <!-- Две панели коммандера (подложка) -->
  <rect x="20" y="24" width="41" height="80" rx="6" fill="#1e1e24" stroke="#3f3f46" stroke-width="1.5" opacity="0.8"/>
  <rect x="67" y="24" width="41" height="80" rx="6" fill="#1e1e24" stroke="#3f3f46" stroke-width="1.5" opacity="0.8"/>

  <!-- Строки файлов в панелях -->
  <line x1="26" y1="36" x2="48" y2="36" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="44" x2="55" y2="44" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="52" x2="42" y2="52" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>

  <line x1="73" y1="36" x2="101" y2="36" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="44" x2="90" y2="44" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="52" x2="96" y2="52" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>

  <!-- Силуэт ночной птицы (Nightjar), связывающий панели воедино -->
  <path d="M 16 68 
           C 38 64, 52 74, 64 88 
           C 76 74, 90 64, 112 68 
           C 92 78, 78 94, 64 104 
           C 50 94, 36 78, 16 68 Z" 
        fill="url(#wingGlow)"/>

  <!-- Фокусное око птицы -->
  <circle cx="64" cy="80" r="3" fill="#ffffff"/>
</svg>
